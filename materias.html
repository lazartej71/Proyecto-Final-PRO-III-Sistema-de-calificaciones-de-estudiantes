<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./JS/navegation.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="STYLE/style.css" rel="stylesheet">
    <title>Bolentin+ - Estudiantes</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">📚 Bolentin+</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a  id="estudiantesNav"class="nav-link active" aria-current="page" href="#" onclick="mostrarEstudiantes()">Estudiantes</a>
                    </li>
                    <li class="nav-item">
                        <a  id ="materiasNav"class="nav-link" href="#" onclick="mostrarMaterias()">Materias</a>
                    </li>
                    <li class="nav-item">
                        <a  id= "calificacionesNav"class="nav-link" href="#" onclick="mostrarCalificaciones()">Calificaciones</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
      <button class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#modalEstudiante">
        ➕ Nueva Materia    
      </button>
    </div>

    <div class="container mt-4">
      <div class="row" id="listaEstudiantes"></div>
    </div>

    <div class="modal fade" id="modalEstudiante" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">➕ Agregar Materia</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="formularioEstudiante">
              <input type="hidden" id="idEstudianteEditar" />
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre de la Materia</label>
                <input type="text" class="form-control" id="nombreMateria" required />
              </div>
              <div class="mb-3">
                <label for="apellido" class="form-label">Docente a Cargo</label>
                <input type="text" class="form-control" id="DocenteCargo" required />
              </div>
              <div class="mb-3">
                <label for="dni" class="form-label">Nota Mínima de Aprobación</label>
                <input type="number" class="form-control" id="notaMinima" min="1" max="10" step="1" required />
              </div>

            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" id="btnGuardarEstudiante" class="btn btn-primary" form="formularioEstudiante">
              Guardar Materia
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <footer class="bg-dark text-white mt-5">
    <div class="container py-4">
        <div class="row">
            <div class="col-md-6">
                <h5>Sistema de Calificaciones</h5>
                <p>Aplicación CRUD para gestión académica</p>
            </div>
            <div class="col-md-6">
                <h5>Información</h5>
                <ul class="list-unstyled">
                    <li><a href="#" class="text-white-50">Contacto</a></li>
                    <li><a href="#" class="text-white-50">Soporte</a></li>
                    <li><a href="#" class="text-white-50">Acerca de</a></li>
                </ul>
            </div>
        </div>
        <hr class="bg-white-50">
        <p class="text-center text-white-50">&copy; 2025 - Todos los derechos reservados</p>
    </div>
</footer>
</body>
</html>
